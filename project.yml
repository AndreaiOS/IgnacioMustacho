name: Ignacio
options:
  bundleIdPrefix: com.ignaciomustacho
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
targets:
  Ignacio:
    type: application
    platform: iOS
    sources: [Sources]
    configFiles:
      Debug: Configuration/Release.xcconfig
      Release: Configuration/Release.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Ignacio.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "iPhone Developer"
          CODE_SIGN_ENTITLEMENTS: "Sources/Ignacio.entitlements"
        Release:
          CODE_SIGN_IDENTITY: "iPhone Developer"
          CODE_SIGN_ENTITLEMENTS: "Sources/Ignacio.entitlements"
  IgnacioTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/AppTests]
    dependencies:
      - target: Ignacio
  IgnacioUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ignacio
schemes:
  Ignacio:
    build:
      targets:
        Ignacio: all
    test:
      targets: [IgnacioTests, IgnacioUITests]
